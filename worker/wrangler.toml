name = "jarvis"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Konuşma hafızası, notlar ve Google/Spotify bağlantıları burada tutulur.
# id yazılmadığında Cloudflare ilk yayında otomatik oluşturur.
[[kv_namespaces]]
binding = "KV"

# Sabah brifingi: 05:00 UTC = 08:00 İstanbul
[triggers]
crons = ["0 5 * * *"]

[vars]
MODEL = "claude-haiku-5-5"
APP_ORIGIN = "https://caglayankayakoku.github.io"

[observability]
enabled = true
