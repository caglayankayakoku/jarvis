name = "jarvis"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Konuşma hafızası, notlar ve Google/Spotify bağlantıları burada tutulur.
# id yazılmadığında Cloudflare ilk yayında otomatik oluşturur.
[[kv_namespaces]]
binding = "KV"

# Sabah brifingi: 05:00 UTC = 08:00 İstanbul
[triggers]
crons = ["0 5 * * *"]

[vars]
MODEL = "claude-opus-5-5"
APP_ORIGIN = "https://caglayankayakoku.github.io"
GOOGLE_CLIENT_ID = "249973334196-k2p2vdb4kucb7kff2jhcg1if6c2pen3q.apps.googleusercontent.com"
SPOTIFY_CLIENT_ID = "731881fbab874b0bb264a1943e1e98a2"

[observability]
enabled = true
